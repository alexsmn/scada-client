<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <!-- Telecontrol SCADA application mark.
       Bespoke, per docs/client/ux/iconography.md §6 step 5: Lucide has no glyph
       that means this product, and the thematic ones are already spoken for by
       the rail (waypoints = Nodes, router = Devices).

       Drawn in Lucide's language — round caps and joins, no fill on the
       strokes, one weight — but massed for an app icon rather than for chrome.
       The stroke is 8.3% of the canvas, the same ratio Lucide's 2px-on-24
       gives, which at 1024 means 85px rather than a hairline.

       It descends from the icon it replaces: a hub wired to endpoints that
       carry state. What it drops is the gear (Lucide `settings` is now the
       settings glyph, so a gear would collide) and the skeuomorphic dial.
       Colours are the product's own severity tokens, not decoration -
       good / uncertain / bad, plus accent for the quiet fourth. -->
  <rect width="1024" height="1024" rx="228" fill="#1E1E1E"/>

  <g stroke="#E6E6E6" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <!-- Spokes: hub to each endpoint. The lower-left run is dashed, the one
         telemetry cue kept from the old mark. -->
    <path d="M420 420 L318 318"/>
    <path d="M604 420 L706 318"/>
    <path d="M604 604 L706 706"/>
    <path d="M420 604 L318 706" stroke-dasharray="34 46"/>
  </g>

  <!-- Hub: the control centre. Stroked, not filled, so it stays a drawing
       rather than a blob at 16 px. -->
  <circle cx="512" cy="512" r="132" stroke="#E6E6E6" stroke-width="56"/>
  <circle cx="512" cy="512" r="34" fill="#E6E6E6"/>

  <!-- Endpoints, carrying state. Large enough to still read as four distinct
       marks when the icon is 32 px in a Finder list. -->
  <circle cx="276" cy="276" r="96" fill="#44C091"/>
  <circle cx="748" cy="276" r="96" fill="#E6B24B"/>
  <circle cx="748" cy="748" r="96" fill="#F07168"/>
  <circle cx="276" cy="748" r="96" fill="#77B4F3"/>
</svg>
