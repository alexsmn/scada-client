<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <!-- The small-size cut of the application mark, for the 16 and 32 px slots.
       Same composition, fewer marks: the hub becomes a solid mass instead of a
       ring with a core, the spokes thicken, the endpoints grow, and the dashed
       run goes solid. Detail that reads at 128 px is mush at 16, so it is
       dropped rather than shrunk — Apple's HIG asks for exactly this, and it is
       why an app icon is not one drawing scaled.

       Kept identical to app-mark.svg: the topology, the colours, and their
       order. At a glance in a Finder list it is the same mark. -->
  <rect width="1024" height="1024" rx="228" fill="#1E1E1E"/>

  <g stroke="#E6E6E6" stroke-width="84" stroke-linecap="round">
    <path d="M400 400 L318 318"/>
    <path d="M624 400 L706 318"/>
    <path d="M624 624 L706 706"/>
    <path d="M400 624 L318 706"/>
  </g>

  <circle cx="512" cy="512" r="128" fill="#E6E6E6"/>

  <circle cx="268" cy="268" r="132" fill="#44C091"/>
  <circle cx="756" cy="268" r="132" fill="#E6B24B"/>
  <circle cx="756" cy="756" r="132" fill="#F07168"/>
  <circle cx="268" cy="756" r="132" fill="#77B4F3"/>
</svg>
