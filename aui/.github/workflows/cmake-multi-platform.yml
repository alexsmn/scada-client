# Standalone CI for the aui repository. Inert while aui lives inside the
# scada-client repo (GitHub only reads .github/ at the repo root); becomes
# active once aui is split out. Mirrors the scada-client workflow.
#
# NOTE: the checkout path for this repo must be `aui` — headers are included
# as "aui/<header>" and the targets export the parent directory.
# NOTE: view_manager_qt has no published remote yet; point its checkout at
# wherever that repo is hosted (same remote as the scada superproject's
# third_party/view_manager_qt submodule) before enabling this workflow.

name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            triplet: x64-windows
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++

    env:
      VCPKG_BINARY_SOURCES: 'clear;default'

    steps:
    - uses: actions/checkout@v4
      with:
        path: aui

    - uses: actions/checkout@v4
      with:
        repository: alexsmn/scada-core
        path: scada-core

    - uses: actions/checkout@v4
      with:
        repository: alexsmn/transport
        path: transport

    - uses: actions/checkout@v4
      with:
        repository: alexsmn/graph-qt
        path: graph_qt

    # TODO(view_manager_qt): fix the repository once it has a published
    # remote, then remove `continue-on-error`.
    - uses: actions/checkout@v4
      continue-on-error: true
      with:
        repository: alexsmn/view-manager-qt
        path: view_manager_qt

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y autoconf automake autoconf-archive libltdl-dev

    - name: Normalize workspace path
      shell: bash
      run: echo "WORKSPACE=${{ github.workspace }}" | sed 's|\\|/|g' >> "$GITHUB_ENV"

    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@master

    - name: Setup MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 'e5a1490e1409d175932ef6014519e9ae149ddb7c'

    - name: Configure
      working-directory: aui
      run: >
        cmake --preset ninja
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_MODULE_PATH="${{ env.WORKSPACE }}/scada-core;${{ env.WORKSPACE }}/transport;${{ env.WORKSPACE }}/transport/cmake;${{ env.WORKSPACE }}/graph_qt;${{ env.WORKSPACE }}/view_manager_qt"
        ${{ matrix.triplet && format('-DVCPKG_TARGET_TRIPLET={0}', matrix.triplet) || '' }}

    - name: Build
      working-directory: aui
      run: cmake --build build/ninja --config RelWithDebInfo

    - name: Test
      working-directory: aui
      run: ctest --test-dir build/ninja --build-config RelWithDebInfo --output-on-failure
