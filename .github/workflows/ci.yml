# CI for scada-client, which runs on the published export at
# github.com/alexsmn/scada-client.
#
# Three jobs: cppcheck and a three-platform build, which both gate, and on a
# `v*` tag a release job that publishes what the build packaged. See the
# release job's comment for what a release carries and what it deliberately
# does not.
#
# THE BUILD JOB EXISTS AGAIN AS OF 2026-09-20, after a year in which it could
# not. The obstacle was never Qt: it was that a standalone client build resolves
# its consumed products as sibling checkouts (ADR 0011), and `display` -- the
# schematic renderer -- is SOURCE that is deliberately never published, so one
# of those siblings could not exist on a public runner. Its BINARY is a
# different question and the opposite answer: that is the whole compromise
# ADR 0013 makes, and `display_runtime` ships as a release asset on this very
# repository. ADR 0013 replaced the source
# dependency with a C ABI over a shared library loaded at RUN time. The client
# no longer compiles `display`; it carries one C header describing the
# interface, and every other product in its closure is public (`net`, `graph_qt`
# and `view_manager_qt` resumed publishing the same day). A client with no
# runtime beside it builds, runs, and reports that it has no schematic renderer.
#
# The workflow deleted in August 2026 is not what came back. That one cloned the
# pre-monorepo repositories and hand-assembled CMAKE_MODULE_PATH across them,
# took 4-6h per run, and last ran in February 2026 because it triggered on
# `release/2.5` while export.py publishes the default branch. This one resolves
# products by name through build-support/ and triggers on what is published.
#
# cppcheck here is the same configuration the build runs -- see
# `scada_configure_cppcheck()` in build-support/ScadaProductBase.cmake, which
# reads this product's own .cppcheck-suppressions.

name: CI

on:
  push:
    branches: [ "main", "release/**" ]
    # A version tag runs the whole matrix and then the release job. The tag
    # must name the version client/CMakeLists.txt declares; the build job
    # refuses a mismatch before it spends hours compiling.
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "release/**" ]

env:
  # Pinned, and built from source below rather than installed from apt. See the
  # "Build cppcheck" step for why the distro package will not do.
  CPPCHECK_VERSION: "2.21.0"

jobs:
  analyze:
    name: Static Analysis
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Cache cppcheck
      id: cache-cppcheck
      # https://github.com/actions/cache/releases/tag/v6.1.0
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/cppcheck
        key: cppcheck-${{ env.CPPCHECK_VERSION }}-${{ runner.os }}

    # ubuntu-latest is Ubuntu 24.04, whose `cppcheck` package is 2.13 — eight
    # releases behind, and it disagrees with a developer's local cppcheck in
    # both directions. Measured against this tree on 2026-08-15, same flags and
    # same suppressions: 2.13 reports 2 errors and 39 findings, 2.21 reports 0
    # errors and 314. The two errors are `danglingTempReference` at
    # modules/debugger/debugger_module.cpp:42-43, which 2.13 gets wrong —
    # BasicCommandRegistry::AddCommand returns a reference into its
    # `command_map_` and MenuContribution holds its `title` and `command_id` by
    # value, so nothing dangles — and which 2.19 and later do not report. The
    # 314 is mostly `uninitMemberVarNoCtor`, a check 2.13 does not have at all.
    # Running the distro package would therefore gate the job on a false
    # positive while hiding a whole category, so the version is pinned instead.
    #
    # FILESDIR is baked in at configure time from CMAKE_INSTALL_PREFIX, so the
    # cache must restore to the same path it was built for.
    - name: Build cppcheck ${{ env.CPPCHECK_VERSION }}
      if: steps.cache-cppcheck.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ python3
        git clone --depth 1 --branch "$CPPCHECK_VERSION" \
          https://github.com/danmar/cppcheck.git /tmp/cppcheck-src
        cmake -S /tmp/cppcheck-src -B /tmp/cppcheck-src/build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$HOME/cppcheck" \
          -DUSE_MATCHCOMPILER=ON
        cmake --build /tmp/cppcheck-src/build -j"$(nproc)"
        cmake --install /tmp/cppcheck-src/build

    - name: Run cppcheck
      run: |
        "$HOME/cppcheck/bin/cppcheck" --version

        "$HOME/cppcheck/bin/cppcheck" \
          --enable=warning,performance,portability \
          --suppressions-list=.cppcheck-suppressions \
          --inline-suppr \
          --std=c++20 \
          -j2 \
          -I . \
          --output-file=cppcheck-report.txt \
          app/ aui/ base/ clipboard/ controller/ core/ main_window/ \
          modules/ profile/ properties/ resources/ services/ test/ tools/ ui/ \
          2>&1 || true

        cat cppcheck-report.txt

        # Errors gate; warnings are reported but do not fail the job. cppcheck's
        # own --error-exitcode cannot express that split — it fires on any
        # finding — so the severity is read back out of the report.
        if grep -q "error:" cppcheck-report.txt; then
          echo "::error::cppcheck found errors"
          exit 1
        fi

    - name: Upload cppcheck report
      if: always()
      # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: cppcheck-report
        path: cppcheck-report.txt
        retention-days: 7

  # ── Build ─────────────────────────────────────────────────────────────────
  #
  # THIS JOB BECAME POSSIBLE ON 2026-09-20 AND HAD BEEN IMPOSSIBLE BEFORE.
  # A standalone client build resolves the products it consumes as sibling
  # checkouts (ADR 0011), and `display` -- the schematic renderer -- is SOURCE
  # that is deliberately never published; its BINARY ships as a release asset
  # on this repository, which is the compromise ADR 0013 exists to make.
  # ADR 0013 replaced the source dependency with a C ABI over a
  # shared library loaded at run time, so the client's *source* closure is now
  # one C header plus products that are all public. The runtime binary is not
  # needed to build; a client without one runs and reports that it has none.
  #
  # WHAT IS NOT COVERED, AND CANNOT BE. `client_server_e2e_tests` skips here:
  # it drives tier binaries, and every tier is a separately sold product that is
  # unpublished, so no public runner can assemble that suite whatever we do.
  #
  # THE FIRST RUNS WILL BE SLOW, AND MAY TIME OUT. vcpkg builds Qt, gRPC, Boost,
  # OpenSSL, protobuf and opentelemetry-cpp from source; there is no prebuilt
  # Qt here. The binary cache carried between runs (see the `env:` block) is
  # what makes the SECOND run cheap -- vcpkg writes each port to it as that
  # port completes, so even a job that dies at the 6-hour limit leaves the
  # cache further along than it found it, and a later run continues from there.
  # It took many runs before the first green one, on Windows above all.
  #
  # The job gates. It carried `continue-on-error: true` while it bootstrapped,
  # because the first runs said more about the cache than about the code. The
  # flag came off after the first run green on all three platforms
  # (scada-client run 40439310927, 2026-10-27). Do not put it back to get past
  # a failure: a build job that is allowed to fail is decoration, which is
  # what core's matrix was until 2026-09-27 (superproject tasks.md 316).
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows / MSVC
            os: windows-latest
          - name: Ubuntu / GCC
            # Pinned, not ubuntu-latest: that label moves to Ubuntu 26 from
            # 2026-10-19 (actions/runner-images#14748), and GCC 14 and the apt
            # packages this leg installs were checked against 24.04.
            os: ubuntu-24.04
          - name: macOS / AppleClang
            os: macos-latest

    env:
      # The binary cache is a plain DIRECTORY, carried between runs by
      # actions/cache below.
      #
      # NOT `x-gha`, which every recipe on the internet still recommends and
      # which vcpkg has REMOVED: the tool in this tree
      # (2026-05-27-d5b6777d) answers a binary source of that name with "The
      # 'x-gha' binary caching backend has been removed. Consider using a
      # NuGet-based binary caching provider instead", and its list of valid
      # providers -- clear, default, nuget, nugetconfig, nugettimeout,
      # interactive, x-azblob, x-gcs, x-aws, x-aws-config, http, files -- does
      # not contain it. So a workflow written from the usual recipe fails at
      # the first configure rather than merely building slowly. Read out of the
      # tool binary's own message catalogue, 2026-09-20.
      #
      # `files` over `nuget` because it needs no package registry, no
      # `packages: write` permission and no second credential: the cache is a
      # directory, and the restore/save steps below are what make it survive a
      # run. The NuGet route is the one to take if the 10 GB per-repository
      # cache limit becomes the binding constraint.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"

    steps:
    # ── The sibling layout ──────────────────────────────────────────────────
    #
    # In an export every consumed product is a sibling directory NAMED AFTER THE
    # PRODUCT (build-support/ScadaProducts.cmake resolves `../<name>`), which is
    # not always the repository's name: `net` publishes as `transport` and
    # `graph_qt` as `graph-qt`. So each checkout names its `path` explicitly and
    # the directory name is what matters, never the repo's.
    #
    # The list is the client's transitive closure, not just what it names:
    # client -> common, core, opcuapp, graph_qt, view_manager_qt; common -> core,
    # express, opcuapp; core -> net; opcuapp -> net. `aui` is in-tree.
    - name: Check out scada-client
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: client

    - name: Check out scada-common
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: alexsmn/scada-common
        path: common

    - name: Check out scada-core
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: alexsmn/scada-core
        path: core

    - name: Check out opcuapp
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: alexsmn/opcuapp
        path: opcuapp

    - name: Check out graph-qt
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: alexsmn/graph-qt
        path: graph_qt

    - name: Check out view_manager_qt
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: alexsmn/view_manager_qt
        path: view_manager_qt

    # Publishes as `transport`; the directory must be `net`.
    - name: Check out transport (the `net` product)
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: alexsmn/transport
        path: net

    - name: Check out express
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: alexsmn/express
        path: express

    # A tag that does not match the project version would publish a package
    # whose bundle, About dialog and file names all say a different version
    # from the release they hang on. Checked first, so a typo costs seconds.
    - name: Check the tag against the project version
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        declared=$(awk '/^project\(scada-client/{f=1} f&&$1=="VERSION"{print $2; exit}' client/CMakeLists.txt)
        if [ "${GITHUB_REF_NAME#v}" != "$declared" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not match project(scada-client VERSION $declared)"
          exit 1
        fi

    # ── Toolchain ───────────────────────────────────────────────────────────

    # Qt's vcpkg build needs the X11/XCB/font development headers on Linux; none
    # of this is needed on the other two, where the platform SDK carries the
    # equivalents. Kept to what qtbase's port actually asks for rather than a
    # blanket `build-dep qtbase`, which pulls a distro Qt we must not link.
    #
    # The X11/XCB line is qtbase's portfile's own list, verbatim (its "can be
    # installed on Ubuntu systems via" message at the pinned vcpkg commit),
    # `'^libxcb.*-dev'` regex included; plus libsm-dev/libice-dev, which the
    # port's `xcb-sm` feature needs. A hand-picked subset stood here until
    # 2026-09-26 and failed qtbase's configure (run 36284598209): no
    # libx11-xcb-dev, no libxcb-xinput-dev, so `xcb`, `xcb_xlib`, `xcb_sm` and
    # `system_xcb_xinput` could not be forced on.
    - name: Install Qt's build dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          autoconf autoconf-archive automake libtool libltdl-dev autopoint \
          pkg-config bison flex \
          libdbus-1-dev libfontconfig1-dev libfreetype-dev \
          libgl1-mesa-dev \
          '^libxcb.*-dev' libx11-xcb-dev libglu1-mesa-dev libxrender-dev \
          libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1-mesa-dev \
          libsm-dev libice-dev \
          libx11-dev libxext-dev libxfixes-dev \
          libxrandr-dev libxss-dev libxtst-dev

    # xvfb for the test step, which runs the suite on a real (virtual) display
    # rather than on Qt's offscreen platform. See that step's comment: the two
    # reasons that made the offscreen platform unusable here are both fixed,
    # but nobody has run a Linux leg without xvfb to find out whether it can go.
    - name: Install Ninja and Xvfb (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get install -y ninja-build xvfb

    # GCC 14, not the runner's default GCC 13. GCC 13.3 hits an internal
    # compiler error -- `in build_special_member_call, at cp/call.cc:11096` --
    # on coroutine code this build compiles (opcuapp's
    # client_protocol_session.cpp:574 and client_protocol_subscription.cpp:118,
    # core's monitored_item_service_awaitable.cpp:60). It is deterministic, not
    # load: reproduced serially on an idle container, and on opcuapp's first CI
    # run (opcuapp run 36282517652); g++-14.2 compiles all three cleanly.
    # The superproject backlog's 709 recorded the investigation. The ubuntu-24.04 image
    # ships 12.4, 13.3 and 14.2 side by side (actions/runner-images,
    # images/ubuntu/Ubuntu2404-Readme.md, checked 2026-09-26), so this only
    # selects one. Set before vcpkg runs, so its ports build with it too.
    - name: Select GCC 14 (Linux)
      if: runner.os == 'Linux'
      run: |
        echo "CC=gcc-14" >> "$GITHUB_ENV"
        echo "CXX=g++-14" >> "$GITHUB_ENV"

    - name: Install Ninja (macOS)
      if: runner.os == 'macOS'
      run: brew install ninja

    # Autotools, on both Unix legs. Ports built through vcpkg-make (libb2,
    # gperf, and others in Qt's closure) run autoreconf, and vcpkg-make's
    # preflight refuses to start without autoconf, automake, a libtoolize
    # (Homebrew's `glibtoolize` counts) and autoconf-archive's macros. The
    # first run of this job failed at configure on exactly that: libb2 on
    # macOS, which had none of them, and gperf on Ubuntu, which lacked only
    # autoconf-archive (run 36275890762, 2026-09-26). The check is
    # vcpkg_make.cmake's "requires the following programs" block at the
    # vcpkg commit pinned below. The same file's two other system checks
    # are why the Linux list also carries libltdl-dev (a FATAL_ERROR for
    # libxcrypt, which run 36280957436 hit next) and autopoint (autoreconf
    # needs it for any configure.ac using AM_GNU_GETTEXT).
    - name: Install autotools (macOS)
      if: runner.os == 'macOS'
      run: brew install autoconf autoconf-archive automake libtool

    # The presets carry no `environment` block by design (ADR 0011), so on
    # Windows the MSVC toolchain has to be in the environment before cmake runs.
    # A developer's machine does this through SCADA_MSVC_INCLUDE_DIRS in
    # .scada-local.cmake; a runner has no such file, so the developer command
    # prompt's variables are set here instead. Ninja comes with Visual Studio,
    # so no separate install on this platform.
    - name: Set up MSVC (Windows)
      if: runner.os == 'Windows'
      # https://github.com/ilammy/msvc-dev-cmd/releases/tag/v1.13.0
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

    # The pin is the commit this tree's own vcpkg is at, so CI resolves the same
    # ports a developer does.
    #
    # Every product's workflow carries the same one. core's once carried
    # a34c873a9717a888f58dc05571dde15571f56e66, which does not exist in
    # microsoft/vcpkg at all -- the API answers 422, "No commit found for SHA"
    # (checked 2026-09-20) -- and nothing noticed, because every step in that
    # workflow was `continue-on-error` (superproject tasks.md 316, closed
    # 2026-09-27).
    - name: Set up vcpkg
      # https://github.com/lukka/run-vcpkg/releases/tag/v11.6
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
      with:
        vcpkgGitCommitId: 'f3e10653cc27d62a37a3763cd84b38bca07c6075'
        # The manifest is resolved by the CMake toolchain during configure, not
        # here: every product is its own manifest root (ADR 0011 phase 6), and
        # this step only has to put vcpkg on disk and export VCPKG_ROOT.
        runVcpkgInstall: false

    - name: Create the binary cache directory
      run: cmake -E make_directory "${{ github.workspace }}/vcpkg-cache"

    # Restore-and-save rather than `actions/cache`, so the cache is written even
    # when the job fails or is cancelled at the 6-hour limit. That is the whole
    # bootstrap: vcpkg writes each port to the directory as that port finishes,
    # so a run that dies half way through Qt still leaves the next one further
    # along. The run_id in the key makes every run save its own entry, and the
    # restore-keys prefix makes it start from the newest earlier one.
    #
    # run_attempt is in the key too, because a re-run keeps its run_id. Without
    # it the cancelled first attempt of run 37259169471 claimed the key with a
    # partial cache, the re-run's save was refused ("Unable to reserve cache
    # ... another job may be creating this cache"), and the 95 ports it had
    # built -- gRPC and Qt among them, 3h18m of Configure -- were thrown away.
    - name: Restore the vcpkg binary cache
      # https://github.com/actions/cache/releases/tag/v6.1.0
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/vcpkg-cache
        key: vcpkg-${{ matrix.os }}-${{ hashFiles('client/vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          vcpkg-${{ matrix.os }}-${{ hashFiles('client/vcpkg.json') }}-
          vcpkg-${{ matrix.os }}-

    # ── Build ───────────────────────────────────────────────────────────────
    #
    # One configure preset, the same name every product in the tree carries.
    # Release only: a Ninja Multi-Config tree can build all three, but each
    # config is a separate compile of everything and the runner budget is the
    # binding constraint. Debug is a real gap -- it is the configuration that
    # catches a `static const` member with no definition, which Release folds
    # away (tasks.md 476) -- and this job is not the place to close it.

    # Classic OPC and Vidicon are off on Windows: `common`'s opc module does
    # `find_package(OPC REQUIRED)` and its vidicon module
    # `find_package(MIDL REQUIRED)`, both out-of-tree SDKs no public runner has
    # (superproject CLAUDE.md, "Dependencies" -- SCADA_EXTRA_MODULE_PATH). The
    # run that first got this far stopped on OPC (run 36284598209). Both
    # options are Windows-only, and the client skips its vidicon module when
    # `common` builds none.
    - name: Configure
      working-directory: client
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          # Debug information in the Release build (/Z7, and /DEBUG to link
          # it), so that the screenshot generator's crash_trace prints
          # function names and lines rather than bare addresses (backlog 950).
          # These reach this tree's own targets only: vcpkg's ports build
          # with their own triplet flags, so the binary cache is unaffected.
          # `-DEBUG`, not `/DEBUG`: this step runs in Git Bash, whose MSYS
          # layer rewrites an argument starting with `/` into a path, so
          # `/DEBUG` reached the linker as `C:\Program Files\Git\DEBUG` and
          # configure failed (LNK1104 on 'C:\Program.obj', scada-client run
          # 40407208351). link.exe takes either prefix.
          cmake --preset ninja -DBUILD_OPC=OFF -DBUILD_VIDICON=OFF \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded \
            -DCMAKE_EXE_LINKER_FLAGS=-DEBUG \
            -DCMAKE_SHARED_LINKER_FLAGS=-DEBUG
        else
          cmake --preset ninja
        fi

    # `-k 0`: keep going past a failed compile, so one run reports every
    # platform-specific error instead of stopping at the first. The Windows
    # leg found them one per run otherwise (opcuapp runs 36282517652 and
    # 36283768898, each stopping on a different MSVC-only error).
    - name: Build (Release)
      working-directory: client
      run: cmake --build --preset release -- -k 0

    # `if: always()` is the point of splitting restore from save: the ports that
    # DID build have to survive a failed or cancelled job, or the bootstrap
    # above never converges. A plain `actions/cache` saves only on success.
    - name: Save the vcpkg binary cache
      if: always()
      # https://github.com/actions/cache/releases/tag/v6.1.0
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/vcpkg-cache
        key: vcpkg-${{ matrix.os }}-${{ hashFiles('client/vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

    # The E2E suite is skipped at configure time here (no `iec61850pp` sibling
    # and no tier binaries), so this is the unit suite.
    #
    # QT_QPA_PLATFORM is set only on Windows, below. Otherwise each binary
    # chooses for itself: the client's own tests default to offscreen on
    # macOS, and Linux gets a real (virtual) display from xvfb.
    #
    # It is worth knowing that this is now a preference rather than a
    # prohibition, because it was a prohibition twice and both reasons are
    # gone (measured on macOS 2026-09-20; the suite is identical with the
    # variable and without it, 2258/2258 either way):
    #
    #  - It used to ABORT the whole run.
    #    `scada_qt_import_offscreen_platform_into_tests()` linked the offscreen
    #    plugin into this product's own test executables and skipped the ones
    #    consumed products bring in, so `view_manager_qt_unittests` and
    #    `graph_qt_unittests` -- both spliced in through `aui`, both building a
    #    QApplication -- had none. Setting the variable aborted each inside
    #    QApplication's constructor, and because gtest_discover_tests runs the
    #    binary at TEST time, one abort took out the entire ctest invocation
    #    rather than one case.
    #  - It then picked the WRONG SCREEN. The plugin's built-in screen is
    #    800x600 and the fixtures ask for `offscreen:configfile=<path>`, a
    #    1920x1080 description; a bare `offscreen` in the environment won over
    #    that and silently brought the small screen with it, which any test
    #    asserting on restored window geometry would fail. An unadorned
    #    `offscreen` is now upgraded to carry the screen description, so it no
    #    longer can.
    #
    # What has NOT been established is whether the Linux leg could drop xvfb
    # and run offscreen. Nothing here has run that, so xvfb stays.
    - name: Test (Release)
      if: runner.os == 'macOS'
      working-directory: client
      run: ctest --preset test-release --output-on-failure --timeout 300

    # Windows needs Qt's plugin directory named, because its Qt is SHARED.
    # macOS's triplet (arm64-osx) builds Qt statically, so
    # `qt_import_plugins` really links the offscreen plugin into each test
    # executable there. x64-windows builds Qt as DLLs, and that call then
    # links nothing: qoffscreen.dll has to be found at run time, and vcpkg's
    # app-local deployment copies the Qt DLLs beside the tests but not
    # `plugins/`. Every test that builds a QApplication then hung with no
    # output after `[ RUN ]`, natively (scada-client run 36342865771, 1437 of
    # 2466 finished) and offscreen alike (run 37231782423: 1061 non-Qt tests
    # passed, then every Qt test timed out until the six-hour job limit). The
    # first run blamed the native `windows` platform; the second showed it was
    # never the platform, since offscreen hung the same way.
    #
    # The probe runs ONE QApplication test with QT_DEBUG_PLUGINS under a
    # two-minute bound before the suite, so a plugin that still cannot be
    # found fails this job in minutes, prints Qt's own account of where it
    # looked, and does not spend six hours on 1400 identical timeouts.
    #
    # It did fail fast (run 37259169471), but said nothing: exit 127 straight
    # after `[ RUN ]`, with no plugin log. Two things now make it explain
    # itself. Qt on Windows sends its messages to OutputDebugString rather
    # than stderr when stderr is not a console, which a CI pipe is not, so
    # QT_FORCE_STDERR_LOGGING routes them back. And 127 is how MSYS bash
    # reports a Windows process killed by a DLL that could not be loaded, so
    # the probe prints the DLLs the plugin and the test import, for comparison
    # with what sits beside the test.
    #
    # With that, run 40098873156 named the cause: the plugin loaded from
    # QT_PLUGIN_PATH, then `Could not find platform config file D`. The test
    # fixture had turned the bare `offscreen` into
    # `offscreen:configfile=D:/a/...`, and Qt splits platform arguments on
    # `:`, so the drive letter cut the path to `D`. AppEnvironment
    # (aui/test/qt/app_environment.h) no longer attaches a screen
    # description on Windows. The 127 was not a missing DLL: every Qt DLL
    # the plugin and the test import was beside the test.
    - name: Probe Qt plugin loading (Windows)
      if: runner.os == 'Windows'
      working-directory: client
      shell: bash
      env:
        QT_QPA_PLATFORM: offscreen
        QT_PLUGIN_PATH: ${{ github.workspace }}/client/build/ninja/vcpkg_installed/x64-windows/Qt6/plugins
        QT_QPA_FONTDIR: C:\Windows\Fonts
        QT_DEBUG_PLUGINS: 1
        QT_FORCE_STDERR_LOGGING: 1
      run: |
        plugins=build/ninja/vcpkg_installed/x64-windows/Qt6/plugins
        ls "$plugins/platforms"
        echo "--- DLLs qoffscreen.dll imports:"
        dumpbin //nologo //dependents "$plugins/platforms/qoffscreen.dll" | grep -i '\.dll'
        echo "--- DLLs aui_qt_unittests.exe imports:"
        dumpbin //nologo //dependents build/ninja/bin/Release/aui_qt_unittests.exe | grep -i '\.dll'
        echo "--- Qt DLLs beside the test:"
        ls build/ninja/bin/Release/[Qq]t6* 2>/dev/null || true
        set +e
        timeout 120 build/ninja/bin/Release/aui_qt_unittests.exe \
          --gtest_filter=DialogServiceImplQtTest.RunMessageBoxMapsNoButtonResult
        rc=$?
        set -e
        echo "probe exit code: $rc"
        exit $rc

    # Offscreen, because a hosted runner has no interactive desktop. On
    # Windows a bare `offscreen` keeps the plugin's 800x600 screen (see
    # aui/test/qt/app_environment.h for why it cannot take the 1920x1080
    # description there). `timeout-minutes` bounds the step well inside the
    # job's six hours, so a regression of the hang above still reaches the log
    # upload.
    #
    # QT_QPA_FONTDIR is what gives offscreen Qt any fonts at all on Windows.
    # There the plugin uses QFreeTypeFontDatabase, which loads from
    # QPlatformFontDatabase::fontDir(): QT_QPA_FONTDIR, or else
    # <Qt libraries>/fonts, which vcpkg's Qt does not have (qtbase 6.11
    # src/plugins/platforms/offscreen/qoffscreenintegration.cpp and
    # src/gui/text/qplatformfontdatabase.cpp, read 2026-10-26). Without it
    # every glyph rendered as a box: run 40339418463's golden images were all
    # tofu, and the monospace face measured no wider than the UI font because
    # both were the same fallback.
    - name: Test (Release, offscreen)
      if: runner.os == 'Windows'
      working-directory: client
      timeout-minutes: 90
      env:
        QT_QPA_PLATFORM: offscreen
        QT_PLUGIN_PATH: ${{ github.workspace }}/client/build/ninja/vcpkg_installed/x64-windows/Qt6/plugins
        QT_QPA_FONTDIR: C:\Windows\Fonts
      run: ctest --preset test-release --output-on-failure --timeout 300

    - name: Test (Release, under Xvfb)
      if: runner.os == 'Linux'
      working-directory: client
      run: xvfb-run --auto-servernum ctest --preset test-release --output-on-failure --timeout 300

    # ── Release packaging (v* tags only) ────────────────────────────────────
    #
    # After the tests, so a release is only ever cut from a build that passed
    # them. macOS and Windows only: the Client is not shipped for Linux.
    # client/tools/release/package.sh does the work, so the same packaging can
    # be dry-run on a developer's machine; its header documents the inputs.
    #
    # Signing is optional and all-or-nothing per group. With no secrets the
    # job still releases, unsigned, and the release notes say so and say how a
    # user opens the app anyway. The secrets reach only the steps that need
    # them, never the build or test steps, which run third-party code.
    - name: Import the signing certificate (macOS)
      if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
      shell: bash
      env:
        MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      run: |
        if [ -z "$MACOS_CERTIFICATE_P12_BASE64" ]; then
          echo "::notice::MACOS_CERTIFICATE_P12_BASE64 is not set; the macOS Client will be released unsigned"
          exit 0
        fi
        [ -n "$MACOS_CERTIFICATE_PASSWORD" ] ||
          { echo "::error::MACOS_CERTIFICATE_P12_BASE64 is set but MACOS_CERTIFICATE_PASSWORD is not"; exit 1; }
        # A throwaway keychain, so nothing lands in the runner's login one.
        keychain="$RUNNER_TEMP/release-signing.keychain-db"
        keychain_password=$(openssl rand -hex 24)
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
        security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
          -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        rm -f "$RUNNER_TEMP/certificate.p12"
        # Lets codesign use the key without a GUI prompt nobody can answer.
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$keychain_password" "$keychain" > /dev/null
        # Unquoted on purpose: the existing search list, one keychain a word.
        # shellcheck disable=SC2046
        security list-keychains -d user -s "$keychain" \
          $(security list-keychains -d user | tr -d '"')
        identity=$(security find-identity -v -p codesigning "$keychain" |
          awk -F'"' '/Developer ID Application/{print $2; exit}')
        [ -n "$identity" ] ||
          { echo "::error::the certificate holds no 'Developer ID Application' identity"; exit 1; }
        echo "Signing as: $identity"
        echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

    # Run from the workspace root so SCADA_SOURCE_DIRS can name the sibling
    # checkouts by their directory; SOURCES.txt then records the exact commit
    # of every product the package was built from.
    - name: Package the Client
      if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Linux'
      shell: bash
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        SCADA_SOURCE_DIRS: client common core opcuapp graph_qt view_manager_qt net express
      run: |
        if [ -n "$APPLE_ID$APPLE_TEAM_ID$APPLE_APP_SPECIFIC_PASSWORD" ]; then
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "::error::notarisation needs all three of APPLE_ID, APPLE_TEAM_ID and APPLE_APP_SPECIFIC_PASSWORD"
            exit 1
          fi
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "${MACOS_SIGNING_IDENTITY:-}" ]; then
            echo "::error::notarisation credentials are set but there is no signing certificate"
            exit 1
          fi
        else
          unset APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD
        fi
        client/tools/release/package.sh client/build/ninja "${GITHUB_REF_NAME#v}" dist

    - name: Remove the signing keychain (macOS)
      if: always() && startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
      shell: bash
      run: security delete-keychain "$RUNNER_TEMP/release-signing.keychain-db" 2>/dev/null || true

    # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
    - name: Upload the release package
      if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Linux'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: client-release-${{ runner.os }}
        path: dist/
        if-no-files-found: error
        retention-days: 14

    - name: Upload the test log
      if: failure()
      # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ctest-log-${{ matrix.os }}
        path: client/build/ninja/Testing/
        retention-days: 7

    # The Linux golden images for graph_qt and view_manager_qt. Goldens are per
    # platform (offscreen Qt draws text with the host's fonts), and Linux's set
    # has to be recorded HERE, on this runner, to match what this runner
    # draws. A golden that does not exist yet is written by the test, which
    # then skips; this uploads those new files, plus any `actual_*` render of
    # a mismatch, so they can be reviewed and committed under
    # <product>/testdata/linux/. Neither product has CI of its own, so this
    # leg is the only Linux runner either one gets.
    - name: Upload the Linux golden images
      if: always() && runner.os == 'Linux'
      # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: linux-goldens
        path: |
          graph_qt/testdata/linux/
          view_manager_qt/testdata/linux/
        if-no-files-found: ignore
        retention-days: 14

    # The same for Windows, whose CI leg runs offscreen and so draws text
    # differently from the native-platform set at the top of each testdata/
    # (scada-client run 40138625293). The tests select
    # <product>/testdata/windows-offscreen/ when the platform is offscreen on
    # Windows; review these and commit them there.
    - name: Upload the Windows offscreen golden images
      if: always() && runner.os == 'Windows'
      # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: windows-offscreen-goldens
        path: |
          graph_qt/testdata/windows-offscreen/
          view_manager_qt/testdata/windows-offscreen/
        if-no-files-found: ignore
        retention-days: 14

  # ── Release ───────────────────────────────────────────────────────────────
  #
  # On a `v*` tag, after both other jobs pass, collects what the build legs
  # packaged and attaches it to a DRAFT release for this tag. Draft, so the
  # release notes and the assets are looked at by a person before anyone can
  # download them; publishing is one click on the release page. A re-run for a
  # tag whose release already exists replaces the assets and leaves the notes
  # alone.
  #
  # WHAT IS NOT IN IT. The display runtime -- the schematic renderer, loaded
  # at run time through a C ABI (ADR 0013) -- is not bundled while its licence
  # is unsettled (superproject tasks.md 788). A Client without it is a
  # supported state: it runs, and schematic windows say there is no display
  # runtime. package.sh refuses a package that contains one.
  #
  # No action creates the release: `gh` is preinstalled on the runner, which
  # leaves no third-party pin holding the repository's write token.
  release:
    name: Release
    needs: [ analyze, build ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    # https://github.com/actions/download-artifact/releases/tag/v8.0.2
    - name: Download the packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: client-release-*
        merge-multiple: true
        path: dist

    # The Client packages join the product release for the same tag, the one
    # that carries the Windows MSI (`telecontrol-scada-<version>.msi`, built
    # and uploaded by hand): the manual's download link is /releases/latest,
    # so a Client-only release published as latest would hide the MSI. If the
    # release already exists, draft or published, the packages are added to it
    # and its notes keep everything outside the marked Client section, so a
    # re-run replaces that section rather than appending a second one.
    # Otherwise a draft is created under the product's title for the MSI to be
    # added to before it is published.
    - name: Add the packages to the product release
      working-directory: dist
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version=${GITHUB_REF_NAME#v}
        begin='<!-- client-packages:begin -->'
        end='<!-- client-packages:end -->'
        {
          echo "$begin"
          echo "## Client for macOS and Windows"
          echo
          for f in *.notes.md; do cat "$f"; echo; done
          echo "Schematic (single-line) displays need the display runtime, which is not part of this release. Without it the Client runs normally and schematic windows report that no display runtime is installed."
          echo
          echo "Each Client package carries the licence, third-party notices, and \`SOURCES.txt\` naming the exact commit of every repository it was built from."
          echo "$end"
        } > client-section.md
        assets=(*.dmg *.zip)
        if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body |
            awk -v b="$begin" -v e="$end" '$0 == b { skip = 1 } !skip { if ($0 == "") blanks++; else { while (blanks) { print ""; blanks-- } print } } $0 == e { skip = 0 }' > existing.md
          { cat existing.md; echo; cat client-section.md; } > release-notes.md
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
        else
          { echo "Telecontrol SCADA v$version"; echo; cat client-section.md; } > release-notes.md
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --draft --verify-tag \
            --title "Telecontrol SCADA v$version" \
            --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
        fi
        cat release-notes.md
        msi="telecontrol-scada-$version.msi"
        if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qxF "$msi"; then
          echo "::warning::$GITHUB_REF_NAME has no $msi yet. Attach it before publishing: the manual's Server download is /releases/latest."
          echo "**Attach \`$msi\` before publishing $GITHUB_REF_NAME.** The manual's Server download link is /releases/latest." >> "$GITHUB_STEP_SUMMARY"
        fi
